<div class="mb-4">
  <p-button
    type="button"
    icon="pi pi-chevron-left"
    (click)="prev()"
    [disabled]="isFirstPage()"
    text
  />
  <p-button type="button" icon="pi pi-refresh" (click)="reset()" text />
  <p-button
    type="button"
    icon="pi pi-chevron-right"
    (click)="next()"
    [disabled]="isLastPage()"
    text
  />
</div>
<div class="card">
  <p-table
    [value]="accounts"
    [paginator]="true"
    [rows]="5"
    [first]="first"
    [showCurrentPageReport]="true"
    [tableStyle]="{ 'min-width': '50rem' }"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    (onPage)="pageChange($event)"
    [rowsPerPageOptions]="[10, 25, 50]"
  >
    <ng-template #header>
      <tr>
        <th style="width: 25%">Name</th>
        <th style="width: 25%">Email</th>
        <th style="width: 25%">Created At</th>
        <th style="width: 25%">Verfication Status</th>
      </tr>
    </ng-template>
    <ng-template #body let-account>
      <tr>
        <td>{{ account.name }}</td>
        <td>{{ account.email }}</td>
        <td>{{ account.created_at | date }}</td>
        <td class="flex gap-2">
          <p-button
            label="Approve"
            (onClick)="approveAcc(account.id)"
            severity="secondary"
          />
          <p-button
            label="Reject"
            (onClick)="rejectAcc(account.id)"
            severity="primary"
          />
        </td>
      </tr>
    </ng-template>
    <!-- <ng-template #paginatorleft>
      <p-button type="button" icon="pi pi-plus" text />
    </ng-template>
    <ng-template #paginatorright>
      <p-button type="button" icon="pi pi-cloud" text />
    </ng-template> -->
  </p-table>
</div>
