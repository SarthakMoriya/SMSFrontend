<div class="mx-16">
  <app-user-profile />
  <div class="">
    <app-add-exam-form (fetchExams)="fetchSemesterExams($event)" />
  </div>
  @if (isEditingExam) {
  <div class="">
    <app-edit-exam (fetchExams)="fetchSemesterExams($event)" />
  </div>
  }
  <app-semester-total />

  <div class="flex items-start justify-evenly mt-4">
    @for (semester of semesters; track $index) {
    <p-button
      label="Semester {{ semester }}"
      (onClick)="fetchSemesterExams(semester)"
      outlined="{{ selectedSemester != semester }}"
      raised="false"
    />
    }
  </div>
  <div class="card mt-8" *ngIf="exams.length">
    <p-table [value]="exams" [tableStyle]="{ 'min-width': '60rem' }">
      <ng-template #header>
        <tr>
          <th pSortableColumn="exam_name" style="width: 20%">
            Exam Name <p-sortIcon field="exam_name" />
          </th>
          <th pSortableColumn="obt_marks" style="width: 20%">
            Marks Obt.<p-sortIcon field="obt_marks" />
          </th>
          <th pSortableColumn="total_marks" style="width: 20%">
            Total Marks<p-sortIcon field="total_marks" />
          </th>
          <th pSortableColumn="exam_type" style="width: 20%">
            Exam Type<p-sortIcon field="exam_type" />
          </th>
          <th pSortableColumn="exam_type" style="width: 20%"></th>
        </tr>
      </ng-template>
      <ng-template #body let-exam>
        <tr>
          <td>{{ exam.exam_name }}</td>
          <td>{{ exam.obt_marks }}</td>
          <td>{{ exam.total_marks }}</td>
          <td>{{ exam.exam_type == "mt" ? "mid-term" : "final" }}</td>
          <td (click)="openEditModal(exam)">Edit</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
  <div class="flex gap-4">
    <div class="w-3/12">
      <div class="" id="chart"></div>
      <app-stackbar-chart
        *ngIf="semestersGraphData.datapoints.length"
        [dataPoints]="semestersGraphData.datapoints"
        [axis]="semestersGraphData.axis"
        [chartId]="'chart'"
      />
    </div>
    <div class="w-3/12">
      <div class="" id="chart1"></div>
      <app-stackbar-chart
        *ngIf="semestersGraphData.datapoints.length"
        [dataPoints]="semestersGraphData.datapoints"
        [axis]="semestersGraphData.axis"
        [chartId]="'chart1'"
      />
    </div>
  </div>
</div>
